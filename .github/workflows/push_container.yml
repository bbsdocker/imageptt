name: Generate and Push 3rd Party Container Image for PttBBS

on:
  push:
    branches: master
  schedule:
    - cron: "30 16 * * 0,4"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image-build-amd64:
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - debien_image_ver_name: trixie
            debien_image_ver_number: 13
            experimental: false
          - debien_image_ver_name: sid
            debien_image_ver_number: 14
            experimental: true
    steps:
      -
        name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      -
        name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.debien_image_ver_name }}-amd64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.debien_image_ver_name }}-amd64-${{ steps.date.outputs.date }}
          platforms: linux/amd64
          build-args: |
            MY_DEBIAN_VERSION=${{ matrix.debien_image_ver_name }}
            MY_DEBIAN_VERSION_NUMBER=${{ matrix.debien_image_ver_number }}
  image-build-arm64:
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        include:
          - debien_image_ver_name: trixie
            debien_image_ver_number: 13
            experimental: false
          - debien_image_ver_name: sid
            debien_image_ver_number: 14
            experimental: true
    steps:
      -
        name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      -
        name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.debien_image_ver_name }}-arm64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.debien_image_ver_name }}-arm64-${{ steps.date.outputs.date }}
          platforms: linux/arm64
          build-args: |
            MY_DEBIAN_VERSION=${{ matrix.debien_image_ver_name }}
            MY_DEBIAN_VERSION_NUMBER=${{ matrix.debien_image_ver_number }}
  create-manifest:
    needs: [image-build-amd64, image-build-arm64]
    runs-on: ubuntu-26.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      ## Note: sid version is not going to be created manifest FOR PURPOSE
      - name: Create and Push Manifest for Debian 13
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:trixie \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:trixie-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:trixie-arm64

          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:trixie-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:trixie-arm64

